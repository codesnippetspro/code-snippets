name: Build Reusable

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: core

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: |
          npm install

      - name: Get version
        id: get_version
        run: |
          if [ "${{ inputs.ref }}" = "core" ] || [ -z "${{ inputs.ref }}" ]; then
            VERSION=$(jq -r .version package.json)
          else
            VERSION="${{ inputs.ref }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: npm run bundle

      - name: Upload built zip
        uses: actions/upload-artifact@v4
        with:
          name: code-snippets-${{ steps.get_version.outputs.version }}.zip
          path: bundle/code-snippets*.zip
