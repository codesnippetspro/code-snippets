name: Playwright

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  push:
    branches:
      - 'pro'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: playwright-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-plugin:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-tests')
    name: Build plugin
    uses: ./.github/workflows/build.yml

  Playwright:
    name: Playwright test on PHP 8.1
    runs-on: ubuntu-22.04
    needs: [build-plugin]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-tests')
    env:
      CODE_SNIPPETS_LICENSE: ${{ secrets.CODE_SNIPPETS_LICENSE }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-plugin.outputs.artifact_name }}
          path: ./build

      - name: Copy built plugin to source directory
        run: |
          rm -rf ./src
          cp -r ./build/code-snippets ./src

      - name: Install workflow dependencies (wp-env, playwright)
        run: npm run prepare-environment:ci

      - name: Start WordPress environment
        run: |
          npx wp-env start

      - name: Activate code-snippets-pro plugin
        run: npx wp-env run cli wp plugin activate code-snippets-pro

      - name: Create CI licensing stub and modify Plugin class
        run: |
          # Create the CI stub class file
          cat > ./src/php/class-licensing-ci-stub.php << 'EOF'
          <?php
          namespace Code_Snippets;

          class Licensing_CI_Stub extends Licensing {
              private const MOCK_LICENSE_KEY = 'ci-test-license-key-mock';

              public function __construct() {
                  // Skip parent constructor to avoid Freemius SDK initialization
              }

              public function is_licensed(): bool {
                  return true;
              }

              public function was_licensed(): bool {
                  return true;
              }

              public function get_license_key(): ?string {
                  return self::MOCK_LICENSE_KEY;
              }

              public function register_hooks() {}
              public function plugin_icon(): string {
                  return dirname( CODE_SNIPPETS_FILE ) . '/assets/icon.svg';
              }
              public function is_submenu_visible( bool $is_visible, string $submenu_id ): bool {
                  return 'account' === $submenu_id ? $is_visible : false;
              }
              public function uninstall_hook() {}
              public function override_strings() {}
          }
          EOF
          
          # Directly modify class-plugin.php to use the CI stub instead of the real Licensing class
          sed -i.bak '/\$this->licensing = new Licensing();/i\
          \t\t\t// CI Override: Load the licensing stub\
          \t\t\trequire_once __DIR__ . "/class-licensing-ci-stub.php";\
          ' ./src/php/class-plugin.php
          
          sed -i 's/\$this->licensing = new Licensing();/\$this->licensing = new Licensing_CI_Stub();/' ./src/php/class-plugin.php

      - name: WordPress debug information
        run: |
          npx wp-env run cli wp core version
          npx wp-env run cli wp --info

      - name: Install playwright/test
        run: |
          npx playwright install chromium

      - name: Run Playwright tests
        run: npm run test:playwright

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 2

  test-result:
    needs: [Playwright]
    if: always() && (needs.Playwright.result != 'skipped')
    runs-on: ubuntu-22.04
    name: Playwright - Test Results
    steps:
      - name: Test status
        run: echo "Test status is - ${{ needs.Playwright.result }}"
      - name: Check Playwright status
        if: ${{ needs.Playwright.result != 'success' && needs.Playwright.result != 'skipped' }}
        run: exit 1
