name: Create tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to create the tag for (e.g. 3.6.9) or `next`'
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout core branch
        uses: actions/checkout@v4
        with:
          ref: core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Node dependencies
        run: npm install

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: '8.1'
          working_dir: src
          dev: no

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" = "next" ]; then
            CURR=$(jq -r .version package.json)
            MAJOR=$(echo $CURR | cut -d. -f1)
            MINOR=$(echo $CURR | cut -d. -f2)
            PATCH=$(echo $CURR | cut -d. -f3)
            NEW_PATCH=$((PATCH+1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set npm version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version $VERSION --no-git-tag-version

  release-templates:
    needs: create-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [$(ls .github/RELEASE_TEMPLATE/*.yml | xargs -n1 basename | sed 's/.yml//')]
    steps:
      - name: Checkout core branch
        uses: actions/checkout@v4
        with:
          ref: core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Node dependencies
        run: npm install

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: '8.1'
          working_dir: src
          dev: no

      - name: Run changelog script for template
        id: changelog
        run: |
          npm run changelog -- .github/RELEASE_TEMPLATE/${{ matrix.template }}.yml

      - name: Generate changelog with LLM
        id: ollama
        uses: ai-action/ollama-action@v1
        with:
          model: llama3
          prompt: ${{ steps.changelog.outputs.prompt }}

      - name: Generate and apply patch
        id: patch
        uses: ai-action/ollama-action@v1
        with:
          model: qwen2.5-coder:14b
          prompt: |
            Given the following file content and the following changelog entry, generate a git patch to update the file at ${{ steps.changelog.outputs.target }}:
            ---
            Current file content:
            $(cat ${{ steps.changelog.outputs.target }})
            ---
            Changelog entry:
            ${{ steps.ollama.outputs.response }}
            ---
            Output only the git patch.

      - name: Apply generated patch
        run: |
          echo "${{ steps.patch.outputs.response }}" | git apply -

      - name: Upload changed file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-${{ matrix.template }}
          path: ${{ steps.changelog.outputs.target }}

  commit-and-tag:
    needs: release-templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core branch
        uses: actions/checkout@v4
        with:
          ref: core

      - name: Download all updated files
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: Commit and tag release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-tag.outputs.version }}"
          git ls-files --others --modified --exclude-standard | xargs git add
          git commit -m "chore(release): prepare v$VERSION"
          TAG="v$VERSION"
          git tag $TAG
          git push origin core --follow-tags
          git push origin $TAG
