name: Release new developer version

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Get relese version
        id: get-version
        run: |
          RELEASE_VERSION=$(jq -r .version package.json)
          echo $RELEASE_VERSION
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

          NODE_VERSION=$(cat .node-version)
          echo $NODE_VERSION
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: '${{ steps.get-version.outputs.node_version }}'
      
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: bcmath, curl, mbstring, zip, intl, dom, fileinfo, json, iconv, pdo, pdo_mysql, tokenizer, xml, xmlreader, xmlwriter
      
      - name: Checkout app repository
        id: checkout
        uses: actions/checkout@v3
      
      - name: Install gulp
        id: gulp-install
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --global gulp-cli

      - name: Install node dependencies
        id: yarn-install
        shell: bash
        run: |
          yarn install
      
      - name: Install composer dependencies
        id: composer-install
        shell: bash
        run: |
          (cd src && composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --ignore-platform-reqs)
      
      - name: Gulp bundle
        id: gulp-bundle
        shell: bash
        run: |
          gulp bundle

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get-version.outputs.version }}
          tag_name: ${{ steps.get-version.outputs.version }}
          append_body: true
          # prerelease: false if branch is "pro" or "beta" else true
          files: |
            ./code-snippets-pro.${{ steps.get-version.outputs.version }}.zip
      
